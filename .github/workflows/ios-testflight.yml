name: iOS TestFlight Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      beta_group_names:
        description: Comma-separated TestFlight beta groups
        required: false
        default: Internal Testers
        type: string

permissions:
  contents: read

# Keep an upload running when another commit lands. Serialize build-number
# allocation and uploads; GitHub retains the newest pending release.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 180
    environment: release
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      LITTER_SKIP_ALLEYCAT_UPDATE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      IOS_RUST_PROFILE: mobile-release
      ASC_BYPASS_KEYCHAIN: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_APP_ID: "6794672797"
      TEAM_ID: UF4L3PL7UG
      EXPORT_SIGNING_STYLE: manual
      APP_CODE_SIGN_IDENTITY: iPhone Distribution
      LIVE_ACTIVITY_CODE_SIGN_IDENTITY: iPhone Distribution
      WATCH_CODE_SIGN_IDENTITY: iPhone Distribution
      WATCH_COMP_CODE_SIGN_IDENTITY: iPhone Distribution
      BETA_GROUP_NAMES: ${{ inputs.beta_group_names || 'Internal Testers' }}
      SUBMIT_BETA_REVIEW: "0"
      WAIT_FOR_PROCESSING: "1"

    steps:
      - name: Validate release credentials
        env:
          ASC_PRIVATE_KEY_P8_B64: ${{ secrets.ASC_PRIVATE_KEY_P8_B64 }}
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_APP_STORE_PROFILE_B64 }}
          IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64: ${{ secrets.IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_COMP_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_COMP_APP_STORE_PROFILE_B64 }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8_B64 \
            IOS_DIST_CERT_P12_B64 IOS_DIST_CERT_PASSWORD IOS_APP_STORE_PROFILE_B64 \
            IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64 IOS_WATCH_APP_STORE_PROFILE_B64 \
            IOS_WATCH_COMP_APP_STORE_PROFILE_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build dependencies
        run: |
          brew install xcodegen meson ninja llvm lld jq
          HOMEBREW_NO_AUTO_UPDATE=0 brew install asc
          xcodebuild -version
          asc --version
          # Use Homebrew LLD for the embedded Linux helper. The runner
          # rust-lld binary can have an unresolved libLLVM.dylib dependency.
          linker="$(brew --prefix lld)/bin/ld.lld"
          "$linker" --version
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=$linker" >> "$GITHUB_ENV"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,i686-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Verify embedded helper cross-linking
        working-directory: shared/third_party/litter-ish/embed/supervisor
        run: cargo build --profile supervisor --target aarch64-unknown-linux-musl --target-dir "$RUNNER_TEMP/supervisor-preflight"

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/rust-bridge
          key: ios-testflight-xcode-26.6

      - name: Install signing credentials
        env:
          ASC_PRIVATE_KEY_P8_B64: ${{ secrets.ASC_PRIVATE_KEY_P8_B64 }}
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_B64: ${{ secrets.IOS_APP_STORE_PROFILE_B64 }}
          IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64: ${{ secrets.IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_APP_STORE_PROFILE_B64 }}
          IOS_WATCH_COMP_APP_STORE_PROFILE_B64: ${{ secrets.IOS_WATCH_COMP_APP_STORE_PROFILE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/learnfold-build.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          printf '%s' "$ASC_PRIVATE_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$IOS_DIST_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "ASC_PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          install_profile() {
            local encoded="$1" setting="$2" uuid name managed
            printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            uuid="$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")"
            name="$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")"
            managed="$(plutil -extract IsXcodeManaged raw "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)"
            if [[ "$managed" == "true" ]]; then
              echo "::error::$setting uses an Xcode-managed profile. CI requires a manually created App Store distribution profile."
              exit 1
            fi
            for directory in "$HOME/Library/MobileDevice/Provisioning Profiles" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$directory"
              cp "$RUNNER_TEMP/profile.mobileprovision" "$directory/$uuid.mobileprovision"
            done
            echo "$setting=$name" >> "$GITHUB_ENV"
          }
          install_profile "$IOS_APP_STORE_PROFILE_B64" APP_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$IOS_LIVE_ACTIVITY_APP_STORE_PROFILE_B64" LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$IOS_WATCH_APP_STORE_PROFILE_B64" WATCH_PROVISIONING_PROFILE_SPECIFIER
          install_profile "$IOS_WATCH_COMP_APP_STORE_PROFILE_B64" WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER

      - name: Build, upload, and assign to TestFlight
        run: |
          set -euo pipefail
          # Build and verify the bundled helper from source on this runner.
          make course-exec
          make testflight 2>&1 | tee "$RUNNER_TEMP/testflight.log"
          {
            echo '### TestFlight upload completed'
            echo "Commit: $GITHUB_SHA"
            echo "Groups: $BETA_GROUP_NAMES"
            echo 'External Beta App Review was not submitted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve release logs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/testflight.log
            apps/ios/build/testflight/testflight-build.env
            apps/ios/build/testflight/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/learnfold-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
