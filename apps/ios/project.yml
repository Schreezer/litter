name: Litter
options:
  bundleIdPrefix: com.chirag
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  fileTypes:
    icon:
      file: true
    xcprivacy:
      file: true

# DeveloperID is a release-style configuration used by the Mac Catalyst
# direct-distribution lane (notarized .dmg). It points the LitterMac target
# at a separate, unsandboxed entitlements file so the app can spawn a local
# `codex app-server`. The Mac App Store lane stays on Release with sandbox.
configs:
  Debug: debug
  Release: release
  DeveloperID: release
  MacDevelopment: debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Litter/Bridge/codex_bridge_objc.h
    OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client"
    HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(PROJECT_DIR)/GeneratedRust/Headers"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-device"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-sim"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    DEVELOPMENT_TEAM: UF4L3PL7UG
    # Xcode 15+ explicit-module builds. First clean build is slightly
    # slower, but module graphs are cached per-target after that, so
    # incremental Swift compiles in the app target drop substantially.
    SWIFT_ENABLE_EXPLICIT_MODULES: "YES"
    CLANG_ENABLE_EXPLICIT_MODULES: "YES"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: "3.72.0"
  Hairball:
    # Vendored at 42d52f5 so Learnfold can carry the small Xcode 27
    # `SwiftUI.Document` qualification fix until it lands upstream.
    path: ../../shared/third_party/Hairball
  NativeBlockEditor:
    path: ../../shared/third_party/NativeBlockEditor
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "147.0.0"
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "12.8.0"
targets:
  Litter:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/Litter/Litter.entitlements
      properties:
        # Re-enable after Apple grants CarPlay Voice Based Conversation to the
        # owned `com.chirag.learnfold` App ID. Keeping an unapproved managed
        # entitlement here prevents development profiles from signing.
        # Private CloudKit database used to sync generated courses between the
        # user's Apple devices.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.chirag.learnfold
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)iCloud.com.chirag.learnfold
        # Private Cloud Compute (iOS 27). Apple has granted this managed
        # capability to the owned `com.chirag.learnfold` App ID. Development
        # and distribution profiles must be regenerated after enabling it.
        com.apple.developer.private-cloud-compute: true
        com.apple.security.application-groups:
          - group.com.chirag.learnfold
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: true
        com.apple.iCloud:
          enabled: true
    sources:
      - path: Sources/Litter
        excludes:
          - "**/*.h"
          - PrivacyInfo.xcprivacy
      - path: Sources/Litter/Bridge/UniFFICodexClient.generated.swift
      - path: Sources/Litter/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
      - path: Resources/fs
        type: folder
        buildPhase: resources
      - path: Resources/learnfold-course-exec
        type: file
        buildPhase: resources
      - path: Sources/LitterLiveActivity/CodexTurnLiveActivity.swift
      - path: Sources/LitterWatch/Models/WatchModels.swift
        group: Sources/LitterWatch/Models
      - path: Sources/LitterWatch/Models/WatchSize.swift
        group: Sources/LitterWatch/Models
      - path: Sources/LitterWatch/Models/WatchHapticDetector.swift
        group: Sources/LitterWatch/Models
      - path: Sources/LitterWatch/Models/WatchSnapshotStore.swift
        group: Sources/LitterWatch/Models
      - path: Sources/LitterWatch/Models/WatchDeepLinkRouter.swift
        group: Sources/LitterWatch/Models
      - path: Sources/LitterWatchComplications/LitterServerListPayload.swift
      - path: Sources/LitterWatchComplications/LitterComplicationEntry.swift
      - path: Sources/LitterWatchComplications/LitterRunningTurnPayload.swift
    resources:
      - path: Sources/Litter/Resources/Fonts
      - path: Sources/Litter/Resources/Themes
      - path: Sources/Litter/Resources/home_cat.png
      - path: Sources/Litter/Resources/home_cat_entrance.png
      - path: Sources/Litter/Resources/cat_transmission_01.png
      - path: Sources/Litter/Resources/cat_transmission_02.png
      - path: Sources/Litter/Resources/cat_transmission_03.png
      - path: Sources/Litter/Resources/cat_transmission_04.png
      - path: Sources/Litter/Resources/cat_transmission_05.png
      - path: Sources/Litter/Resources/cat_transmission_06.png
    dependencies:
      - package: PostHog
        product: PostHog
      - sdk: CarPlay.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - sdk: PDFKit.framework
      - package: Hairball
        product: HairballUI
      - package: NativeBlockEditor
        product: NativeBlockEditorCore
      - package: NativeBlockEditor
        product: NativeBlockEditorUI
      - package: NativeBlockEditor
        product: NativeEditorMCP
      - package: WebRTC
        product: WebRTC
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: LitterLiveActivity
        embed: true
      - target: LitterWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold
        INFOPLIST_FILE: Sources/Litter/Info.plist
        LEARNFOLD_HOSTED_AGENT_URL: "https://learnfold-hosted-agent.chiragmgg.workers.dev"
        LEARNFOLD_HOSTED_ACCESS_TOKEN: ""
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Litter/Bridge/codex_bridge_objc.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIBackgroundModes: "audio fetch picture-in-picture"
        # Xcode 27 ships the PCC Foundation Models API without requiring a
        # particular Swift language version. Compile that code only when the
        # selected iOS 27 SDK actually provides it.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.*]": "$(inherited) LEARNFOLD_PRIVATE_CLOUD_COMPUTE_SDK"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.*]": "$(inherited) LEARNFOLD_PRIVATE_CLOUD_COMPUTE_SDK"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
  LitterMac:
    type: application
    platform: auto
    supportedDestinations:
      - macCatalyst
    sources:
      - path: Sources/Litter
        excludes:
          - CarPlay/**
          - Info.plist
          - Litter.entitlements
          - Litter-Catalyst.entitlements
          - Litter-Catalyst-DeveloperID.entitlements
          - Litter-Catalyst-Development.entitlements
          - Models/AppLifecycleController.swift
          - Models/AppRuntimeController.swift
          - Models/CodexTurnAttributes.swift
          - Models/CodexVoiceCallAttributes.swift
          - Models/ContinuedTurnBackgroundController.swift
          - Models/OrientationResponder.swift
          - Models/RealtimeWebRtcSession.swift
          - Models/StableSafeAreaInsets.swift
          - Models/TurnLiveActivityController.swift
          - Models/VoiceRuntimeController.swift
          - Models/VoiceSessionControl.swift
          - Models/VoiceSessionModels.swift
          - Models/WatchCompanionBridge.swift
          - Models/WatchProjection.swift
          - Views/HomeVoiceOrbButton.swift
          - Views/InlineVoiceButton.swift
          - Views/InlineVoiceStatusStrip.swift
          - Views/LiveActivityPreview.swift
          - Views/LockScreenCardView.swift
          - Views/RealtimeVoiceScreen.swift
          - Views/VoiceCallView.swift
          - "**/*.h"
          - PrivacyInfo.xcprivacy
      - path: Sources/Litter/Bridge/UniFFICodexClient.generated.swift
      - path: Sources/Litter/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    resources:
      - path: Sources/Litter/Resources/Fonts
      - path: Sources/Litter/Resources/Themes
      - path: Sources/Litter/Resources/home_cat.png
      - path: Sources/Litter/Resources/home_cat_entrance.png
      - path: Sources/Litter/Resources/cat_transmission_01.png
      - path: Sources/Litter/Resources/cat_transmission_02.png
      - path: Sources/Litter/Resources/cat_transmission_03.png
      - path: Sources/Litter/Resources/cat_transmission_04.png
      - path: Sources/Litter/Resources/cat_transmission_05.png
      - path: Sources/Litter/Resources/cat_transmission_06.png
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - sdk: PDFKit.framework
      - package: PostHog
        product: PostHog
      - package: Hairball
        product: HairballUI
      - package: NativeBlockEditor
        product: NativeBlockEditorCore
      - package: NativeBlockEditor
        product: NativeBlockEditorUI
      - package: NativeBlockEditor
        product: NativeEditorMCP
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_NAME: Litter
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_FILE: Sources/Litter/Info-Catalyst.plist
        LEARNFOLD_HOSTED_AGENT_URL: "https://learnfold-hosted-agent.chiragmgg.workers.dev"
        LEARNFOLD_HOSTED_ACCESS_TOKEN: ""
        # XcodeGen's target.entitlements overrides every configuration, so
        # select the checked-in entitlement files through build settings.
        CODE_SIGN_ENTITLEMENTS: Sources/Litter/Litter-Catalyst.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Litter/Bridge/codex_bridge_objc.h
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-macabi"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        Release:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
        # Direct-distribution (notarized .dmg) lane. Re-points
        # CODE_SIGN_ENTITLEMENTS at the unsandboxed entitlements file so the
        # Mac build can spawn a local `codex app-server`. Same automatic
        # signing flow as Release; the actual cert is selected via the
        # APP_CODE_SIGN_IDENTITY override the script passes through.
        DeveloperID:
          CODE_SIGN_STYLE: "$(APP_CODE_SIGN_STYLE)"
          APP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(APP_CODE_SIGN_IDENTITY)"
          APP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE_SPECIFIER)"
          APP_PROVISIONING_PROFILE_SPECIFIER: ""
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: Sources/Litter/Litter-Catalyst-DeveloperID.entitlements
        MacDevelopment:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: Sources/Litter/Litter-Catalyst-Development.entitlements
          OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lresolv -lcodex_mobile_client -lghostty"
  LitterLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: Sources/LitterLiveActivity/LitterLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chirag.learnfold
    sources:
      - path: Sources/LitterLiveActivity
      - path: Sources/Litter/Models/CodexTurnAttributes.swift
      - path: Sources/Litter/Models/CodexVoiceCallAttributes.swift
      - path: Sources/Litter/Models/LitterPalette.swift
      - path: Sources/Litter/Models/VoiceSessionControl.swift
      - path: Sources/Litter/Views/LockScreenCardView.swift
    resources:
      - path: Sources/LitterLiveActivity/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold.liveactivity
        INFOPLIST_FILE: Sources/LitterLiveActivity/Info.plist
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(LIVE_ACTIVITY_CODE_SIGN_STYLE)"
          LIVE_ACTIVITY_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
          LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ""
          ENABLE_DEBUG_DYLIB: NO
        Release:
          CODE_SIGN_STYLE: "$(LIVE_ACTIVITY_CODE_SIGN_STYLE)"
          LIVE_ACTIVITY_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(LIVE_ACTIVITY_CODE_SIGN_IDENTITY)"
          LIVE_ACTIVITY_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER)"
          LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ""
  LitterWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    entitlements:
      path: Sources/LitterWatch/LitterWatch.entitlements
      properties:
        aps-environment: production
        com.apple.security.application-groups:
          - group.com.chirag.learnfold
    sources:
      - path: Sources/LitterWatch
        excludes:
          - "Assets.xcassets"
      - path: Sources/Litter/AppIcon.icon
    resources:
      - path: Sources/Litter/Resources/Fonts
      - path: Sources/LitterWatch/Assets.xcassets
    dependencies:
      - target: LitterWatchComplications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold.watchkitapp
        INFOPLIST_FILE: Sources/LitterWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        GENERATE_INFOPLIST_FILE: NO
        SDKROOT: watchos
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(WATCH_CODE_SIGN_STYLE)"
          WATCH_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(WATCH_CODE_SIGN_STYLE)"
          WATCH_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(WATCH_CODE_SIGN_IDENTITY)"
          WATCH_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_PROVISIONING_PROFILE_SPECIFIER: ""

  LitterWatchComplications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    entitlements:
      path: Sources/LitterWatchComplications/LitterWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chirag.learnfold
    sources:
      - path: Sources/LitterWatchComplications
        excludes:
          - "Assets.xcassets"
    resources:
      - path: Sources/LitterWatchComplications/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold.watchkitapp.complications
        INFOPLIST_FILE: Sources/LitterWatchComplications/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SDKROOT: watchos
        OTHER_LDFLAGS: ""
        SWIFT_OBJC_BRIDGING_HEADER: ""
        HEADER_SEARCH_PATHS: "$(inherited)"
        SWIFT_INCLUDE_PATHS: "$(inherited)"
      configs:
        Debug:
          CODE_SIGN_STYLE: "$(WATCH_COMP_CODE_SIGN_STYLE)"
          WATCH_COMP_CODE_SIGN_STYLE: Automatic
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: "$(WATCH_COMP_CODE_SIGN_STYLE)"
          WATCH_COMP_CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "$(WATCH_COMP_CODE_SIGN_IDENTITY)"
          WATCH_COMP_CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: "$(WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER)"
          WATCH_COMP_PROVISIONING_PROFILE_SPECIFIER: ""

  LitterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/LitterTests
    dependencies:
      - target: Litter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
  LitterMacTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - macCatalyst
    sources:
      - path: Tests/LitterTests
        includes:
          - CourseAgentPlatformPolicyTests.swift
          - CourseMacRuntimeIntegrationTests.swift
          - LearnfoldStarterCourseAdoptionTests.swift
          - CourseCloudSyncModelsTests.swift
          - CourseCloudSyncRepositoryTests.swift
          - CourseCloudSyncStateStoreTests.swift
          - CourseContinuationSyncTests.swift
          - CourseContinuationStoreIntegrationTests.swift
          - HostedCourseContinuationTests.swift
          - CourseAssessmentAttemptStoreTests.swift
    dependencies:
      - target: LitterMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: ""
        "LIBRARY_SEARCH_PATHS[sdk=macosx*]": "$(inherited) $(PROJECT_DIR)/GeneratedRust/ios-macabi"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold.mac-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Litter.app/Contents/MacOS/Litter"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
  PCCDeviceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests/PCCDeviceTests
    dependencies:
      - target: Litter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.chirag.learnfold.pcc-device-tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UF4L3PL7UG
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.*]": "$(inherited) LEARNFOLD_PRIVATE_CLOUD_COMPUTE_SDK"
  LitterUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/LitterUITests
      - path: SnapshotHelper.swift
    dependencies:
      - target: Litter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Litter
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false

schemes:
  LitterWatch:
    build:
      targets:
        LitterWatch: all
        LitterWatchComplications: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 2
  Litter:
    build:
      targets:
        Litter: all
    run:
      config: Debug
      customLLDBInit: $(SRCROOT)/.lldbinit
    test:
      config: Debug
      targets:
        - LitterTests
        - LitterUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 1
  PCCDeviceTests:
    build:
      targets:
        Litter: all
        PCCDeviceTests:
          - test
    test:
      config: Debug
      targets:
        - PCCDeviceTests
    management:
      isShown: true
      orderHint: 4
  LitterMac:
    build:
      targets:
        LitterMac: all
    run:
      config: MacDevelopment
    test:
      config: MacDevelopment
      targets:
        - LitterMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    # Default archive uses Release (sandboxed) for the App Store lane.
    # The direct-distribution script overrides via `-configuration DeveloperID`.
    archive:
      config: Release
    management:
      isShown: true
      orderHint: 3
